[build]
  command = "node tools/stage-public.mjs"
  publish = ".public-site"
  functions = "netlify/functions"

[[headers]]
  for = "/website-build.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/inventory.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/software/tester"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/software-tester.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/software/design-manager-latest.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/products/old-school-chevy-flag-voc-fl-001"
  to = "/products/old-school-chevy-flag-voc-fl-001.html"
  status = 200

[[redirects]]
  from = "/products/plasma-cut-steel-wall-art-featuring-a-classic-chevy-squarebody-pickup-voc-fl-002"
  to = "/products/plasma-cut-steel-wall-art-featuring-a-classic-chevy-squarebody-pickup-voc-fl-002.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/quote"
  to = "/quote.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/product-inquiry"
  to = "/product-inquiry.html"
  status = 200

[[redirects]]
  from = "/products/bells-christmas-ornament-voc-ot-008"
  to = "/products/bells-christmas-ornament-voc-ot-008.html"
  status = 200

[[redirects]]
  from = "/inventory"
  to = "/inventory.html"
  status = 200

[[redirects]]
  from = "/software"
  to = "/software.html"
  status = 200

[[redirects]]
  from = "/software/tester"
  to = "/software-tester.html"
  status = 200

[[redirects]]
  from = "/licensing-api/checkout/session"
  to = "https://valley-oak-design-manager-licensing.netlify.app/api/v1/checkout/session"
  status = 200
  force = true

[[redirects]]
  from = "/licensing-api/checkout/credential"
  to = "https://valley-oak-design-manager-licensing.netlify.app/api/v1/checkout/credential"
  status = 200
  force = true

[[redirects]]
  from = "/software/success"
  to = "/software-success.html"
  status = 200

[[redirects]]
  from = "/software/canceled"
  to = "/software-canceled.html"
  status = 200
